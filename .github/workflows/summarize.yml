name: Podcast Summary

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      feed:
        description: 'Filter by feed name (substring, e.g. "בזמן שעבדתם")'
        required: false
        default: ''
      test:
        description: 'Test mode — process 1 episode per feed type'
        required: false
        type: boolean
        default: false
      resend_history:
        description: 'Resend all existing results.txt.md entries to Telegram'
        required: false
        type: boolean
        default: false
      resend_history_since:
        description: 'With resend_history, only resend entries generated on/after YYYY-MM-DD'
        required: false
        default: ''
      no_pdf:
        description: 'Skip PDF show-notes extraction (for before/after comparison)'
        required: false
        type: boolean
        default: false
      write_results:
        description: 'Also append summaries to results.txt.md'
        required: false
        type: boolean
        default: true
      hours_lookback:
        description: 'Override lookback window in hours, e.g. 240 for 10 days'
        required: false
        default: ''

permissions:
  contents: write
  models: read

concurrency:
  group: summarize
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: ~/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-v1

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.venv
          ~/.venv/bin/pip install -r requirements.txt

      - name: Add venv to PATH
        run: echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Run pipeline
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TEST: ${{ github.event.inputs.test }}
          INPUT_FEED: ${{ github.event.inputs.feed }}
          INPUT_RESEND_HISTORY: ${{ github.event.inputs.resend_history }}
          INPUT_RESEND_HISTORY_SINCE: ${{ github.event.inputs.resend_history_since }}
          INPUT_NO_PDF: ${{ github.event.inputs.no_pdf }}
          INPUT_WRITE_RESULTS: ${{ github.event.inputs.write_results }}
          INPUT_HOURS_LOOKBACK: ${{ github.event.inputs.hours_lookback }}
        run: |
          args=()
          [ "$INPUT_TEST" = "true" ] && args+=(--test)
          [ -n "$INPUT_FEED" ] && args+=(--feed "$INPUT_FEED")
          [ "$INPUT_RESEND_HISTORY" = "true" ] && args+=(--resend-history)
          [ -n "$INPUT_RESEND_HISTORY_SINCE" ] && args+=(--resend-history-since "$INPUT_RESEND_HISTORY_SINCE")
          [ "$INPUT_NO_PDF" = "true" ] && args+=(--no-pdf)
          [ "$INPUT_WRITE_RESULTS" != "false" ] && args+=(--write-results)
          [ -n "$INPUT_HOURS_LOOKBACK" ] && args+=(--hours "$INPUT_HOURS_LOOKBACK")
          python main.py "${args[@]}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if [ -f results.txt.md ]; then
            git add results.txt.md
          fi
          git add data/transcripts/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update summaries [skip ci]"
            if ! git pull --rebase origin master; then
              if git ls-files -u -- data/seen.json | grep -q .; then
                python -c "import json, subprocess; upstream = json.loads(subprocess.check_output(['git', 'show', ':2:data/seen.json'], text=True)); current = json.loads(subprocess.check_output(['git', 'show', ':3:data/seen.json'], text=True)); entries = {**upstream.get('entries', {}), **current.get('entries', {})}; entries = dict(sorted(entries.items(), key=lambda item: item[1])[-1000:]) if len(entries) > 1000 else entries; open('data/seen.json', 'w', encoding='utf-8').write(json.dumps({'version': 1, 'entries': entries}, ensure_ascii=False, indent=2) + '\n')"
                git add data/seen.json
                GIT_EDITOR=true git rebase --continue
              else
                exit 1
              fi
            fi
            git push origin master
          fi
